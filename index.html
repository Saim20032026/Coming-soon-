<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIDEVIBES | Coming Soon</title>
    <style>
        :root {
            --primary: #2563EB;
            --secondary: #0F172A;
            --accent: #60A5FA;
            --bg: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        /* Preloader */
        #preloader {
            position: fixed; inset: 0; background: var(--bg); display: flex;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s ease;
        }

        body { background: var(--bg); color: var(--secondary); overflow-x: hidden; }
        .container { max-width: 1200px; margin: auto; padding: 20px; text-align: center; }

        header { padding: 30px; font-weight: 800; font-size: 24px; color: var(--primary); }

        h1 { font-size: clamp(3rem, 8vw, 6rem); margin-bottom: 10px; }
        
        /* Bike Animation */
        .bike-scene { height: 200px; position: relative; overflow: hidden; margin: 40px 0; }
        .bike { width: 100px; position: absolute; bottom: 20px; left: -150px; animation: ride 5s linear infinite; }
        
        @keyframes ride {
            0% { left: -150px; }
            100% { left: 100%; }
        }

        /* Countdown */
        .countdown { display: flex; justify-content: center; gap: 20px; margin: 30px 0; }
        .time-box { background: rgba(37, 99, 235, 0.1); padding: 15px; border-radius: 12px; min-width: 80px; font-weight: bold; }

        /* Buttons & Modal */
        button { 
            background: var(--primary); color: white; border: none; padding: 15px 30px;
            border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 1rem;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--accent); }

        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); place-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 40px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; }

        footer { margin-top: 50px; padding: 20px; font-size: 0.8rem; border-top: 1px solid #eee; color: #64748b; }
    </style>
</head>
<body>

    <div id="preloader"><h2>RIDEVIBES LOADING...</h2></div>

    <header>RIDEVIBES</header>

    <div class="container">
        <h1>Coming Soon</h1>
        <p>Revolutionizing Your Ride Experience</p>

        <div class="bike-scene">
            <img src="https://cdn-icons-png.flaticon.com/512/3062/3062634.png" class="bike" alt="bike">
        </div>

        <div class="countdown" id="countdown">
            <div class="time-box"><span id="days">00</span><br>Days</div>
            <div class="time-box"><span id="hours">00</span><br>Hours</div>
            <div class="time-box"><span id="minutes">00</span><br>Mins</div>
            <div class="time-box"><span id="seconds">00</span><br>Secs</div>
        </div>

        <button onclick="document.getElementById('modal').style.display='grid'">Get Launch Updates</button>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h3>Stay Updated</h3>
            <input type="email" placeholder="Enter your Email" style="width:100%; padding: 12px; margin: 20px 0; border: 1px solid #ddd; border-radius: 5px;">
            <button style="width: 100%;" onclick="alert('Thank you! Subscription received.'); document.getElementById('modal').style.display='none'">Subscribe</button>
            <button style="background:none; color:#64748b; margin-top: 10px;" onclick="document.getElementById('modal').style.display='none'">Close</button>
        </div>
    </div>

    <footer>
        MK CODEX WEB SOLUTIONS | YOUR VISION OUR CODE
    </footer>

    <script>
        // Countdown Timer Logic
        const targetDate = new Date("June 30, 2026 00:00:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
            }
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // Preloader Logic
        window.onload = () => {
            setTimeout(() => {
                const loader = document.getElementById('preloader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }, 1500);
        };
    </script>
</body>
</html>
